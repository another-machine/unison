<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unison</title>
    <meta
      name="description"
      content="Chromatic note detection and aural mirror"
    />
    <style>
      @import "amplib-ui.css";
      @import "app.css";
    </style>
  </head>
  <body data-density="compact" style="--ht-anchor-offset: 2.5rem">
    <header class="masthead">
      <h1 class="ht-type-display">unison</h1>
      <div class="ht-arrange-row">
        <span class="badge" data-emphasis="quiet" id="chord">&mdash;</span>
        <button type="button" id="silence" aria-pressed="false">silence</button>
      </div>
    </header>

    <main class="app">
      <p class="ht-type-prose u-dim">
        Give it something to listen to. It finds the chromatic notes in what it
        hears and sings them back at you.
      </p>

      <nav class="tabs" role="tablist" aria-label="source">
        <button type="button" role="tab" id="tab-file" aria-selected="true">
          file
        </button>
        <button
          type="button"
          role="tab"
          id="tab-microphone"
          aria-selected="false"
        >
          microphone
        </button>
      </nav>

      <div class="ht-arrange-sidebar">
        <div class="ht-arrange-stack">
          <section id="source-file" class="ht-arrange-stack">
            <label class="drop" id="drop" data-state="empty">
              <span class="drop__label">choose a file</span>
              <span class="drop__sub"
                >audio or video &mdash; or drop one here</span
              >
              <input
                type="file"
                id="file"
                class="u-sr-only"
                accept="audio/*,video/*"
              />
            </label>
            <div class="frame" id="media-frame" hidden>
              <video id="media" controls playsinline loop></video>
              <span class="frame__caption" id="media-caption"></span>
            </div>
          </section>

          <section id="source-microphone" class="ht-arrange-stack" hidden>
            <div class="field">
              <label for="input">input</label>
              <select id="input" disabled>
                <option>listen first &mdash; devices are named after access</option>
              </select>
              <span class="field__hint">unprocessed input</span>
            </div>
            <div class="toolbar" data-flush>
              <button type="button" id="listen">listen</button>
              <button type="button" id="deafen" disabled>stop</button>
            </div>
          </section>

          <div class="frame">
            <canvas id="scope" aria-label="chromatic spectrum"></canvas>
            <div class="ht-arrange-split">
              <span class="frame__caption" id="scope-caption">&nbsp;</span>
              <span class="frame__caption" id="scope-notes">&nbsp;</span>
            </div>
          </div>

          <p class="status" id="status">idle</p>
        </div>

        <aside class="ht-arrange-stack">
          <section class="panel">
            <header class="panel__header"><span>voice</span></header>
            <div class="panel__body">
              <div class="field">
                <label for="wave">wave</label>
                <select id="wave"></select>
                <span class="field__hint">periodic wave</span>
              </div>
              <div class="field">
                <label for="spread">spread</label>
                <input
                  id="spread"
                  type="range"
                  min="0"
                  max="30"
                  step="0.5"
                  value="7"
                />
                <span class="field__hint">cents, per voice</span>
              </div>
              <div class="field">
                <label for="tone">tone</label>
                <input
                  id="tone"
                  type="range"
                  min="200"
                  max="12000"
                  step="50"
                  value="4000"
                />
                <span class="field__hint">lowpass, Hz</span>
              </div>
              <div class="field">
                <label for="shimmer">shimmer</label>
                <input
                  id="shimmer"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0.25"
                />
                <span class="field__hint">detune drift</span>
              </div>
            </div>
          </section>

          <section class="panel">
            <header class="panel__header"><span>response</span></header>
            <div class="panel__body">
              <div class="field">
                <label for="level">level</label>
                <input
                  id="level"
                  type="range"
                  min="0"
                  max="0.3"
                  step="0.005"
                  value="0.08"
                />
                <span class="field__hint">voice gain</span>
              </div>
              <div class="field">
                <label for="focus">focus</label>
                <input
                  id="focus"
                  type="range"
                  min="0.25"
                  max="6"
                  step="0.05"
                  value="1.6"
                />
                <span class="field__hint">prominence exponent</span>
              </div>
              <div class="field">
                <label for="attack">attack</label>
                <input
                  id="attack"
                  type="range"
                  min="0.005"
                  max="1.5"
                  step="0.005"
                  value="0.06"
                />
                <span class="field__hint">seconds</span>
              </div>
              <div class="field">
                <label for="release">release</label>
                <input
                  id="release"
                  type="range"
                  min="0.02"
                  max="4"
                  step="0.02"
                  value="0.3"
                />
                <span class="field__hint">seconds</span>
              </div>
              <div class="field">
                <label for="monitor">monitor</label>
                <input
                  id="monitor"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0.6"
                />
                <span class="field__hint">source gain, file only</span>
              </div>
            </div>
          </section>
        </aside>
      </div>
    </main>

    <script type="module">
      import "./app.ts";
    </script>
  </body>
</html>
